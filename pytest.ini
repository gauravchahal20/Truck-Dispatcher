[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    live: marks tests as hitting live external network endpoints (excluded by default, run with -m live)
    monthly: marks parser drift tests run on monthly maintenance schedule
addopts = -m "not live" --durations=10
testpaths = backend/tests/unit backend/tests/integration backend/tests/live
