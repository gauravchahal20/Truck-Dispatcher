# TRUCKLEAD AUTOPILOT - Global System Configuration

system:
  app_name: "TRUCKLEAD AUTOPILOT"
  version: "1.0.0"
  log_level: "INFO"
  database_url: "sqlite+aiosqlite:///./data/trucklead.db"
  environment: "development"

# Default Target Ideal Customer Profile (ICP)
icp:
  target_country: "US"
  target_states:
    - "TX"
    - "CA"
    - "GA"
    - "IL"
    - "OH"
    - "PA"
    - "FL"
    - "NC"
    - "IN"
    - "MI"
  fleet_size:
    min: 2
    max: 10
    partial_min: 1
    partial_max: 20
    partial_multiplier: 0.5
    preferred_min: 2
    preferred_max: 10
  equipment_types:
    - "dry_van"
    - "reefer"
    - "flatbed"
    - "drayage"
    - "stepdeck"
    - "power_only"
  carrier_operations:
    - "Interstate"
    - "Intrastate Hazmat"
    - "Intrastate Non-Hazmat"
  authorized_only: true
  min_verification_confidence: 0.70
  score_threshold_for_final: 5.0
  mcs150_min_date: "20241024"  # Default 24-month rolling recency window (on or after 2024-10-24)
  carrier_prefilter:
    enabled: true
    exclude_household_goods: false
    excluded_name_keywords:
      - "wrecker"
      - "towing"
      - "tow"
      - "auto sales"
      - "auto repair"
      - "dealership"
      - "used cars"
      - "landscaping"
      - "landscape"
      - "tree service"
      - "tree care"
      - "dumpster"
      - "dumpsters"
      - "waste"
      - "trash"
      - "junk"
      - "scrap"
      - "concrete"
      - "paving"
      - "roofing"
      - "passenger"
      - "limo"
      - "limousine"
      - "taxi"
      - "bus"
      - "charter"
      - "ambulance"
      - "medical transport"
    excluded_carrier_operations:
      - "Passenger"
      - "Migrant"
      - "Government"
    excluded_cargo_classifications:
      - "Passengers"
      - "Garbage/Refuse"
      - "Driveaway/Towaway"
      - "crgo_passengers"
      - "crgo_garbage"
      - "crgo_drivetow"

# Decision Maker Prioritization
decision_makers:
  priority_order:
    - "Owner"
    - "Founder"
    - "Co-Founder"
    - "President"
    - "CEO"
    - "Managing Partner"
    - "Fleet Manager"
    - "Operations Manager"
    - "Director of Operations"
    - "Dispatch Manager"
    - "Lead Dispatcher"
    - "Safety Director"
    - "Transportation Coordinator"

# Intent Signal Detection Rules
intent_signals:
  enabled: true
  keywords:
    hiring_dispatch:
      - "hiring truck dispatcher"
      - "seeking freight dispatcher"
      - "night dispatcher"
      - "dispatch supervisor"
    hiring_fleet_mgr:
      - "fleet manager wanted"
      - "transportation coordinator"
      - "logistics coordinator"
    fleet_expansion:
      - "adding new trucks"
      - "fleet expansion"
      - "new terminal"
      - "purchased new tractors"
      - "leased 5 new power units"
    public_dispatch_request:
      - "looking for dispatch service"
      - "need reliable dispatch"
      - "for hire carrier seeking freight"
    awards_and_contracts:
      - "awarded freight contract"
      - "government transportation award"
      - "DOD carrier contract"

# Configurable Lead Scoring Matrix
scoring:
  registered_officer_partial_credit: 0.5 # Partial credit (50%) until corroborated by secondary source
  weights:
    target_fleet_size: 2.0        # Fleet size in target range (2-10)
    verified_active_carrier: 2.0  # FMCSA active for-hire authority
    decision_maker_identified: 2.0 # Named decision maker found
    equipment_verified: 1.0       # Target equipment confirmed
    usable_contact: 1.0           # Verified email or valid phone
    intent_signal_present: 1.0    # Detected hiring / expansion / dispatch need
    tech_or_business_event: 1.0   # News / tech adoption / award
  priority_thresholds:
    priority_a_min: 8.0           # Score >= 8.0: Priority A
    priority_b_min: 6.0           # Score 6.0 - 7.9: Priority B
    priority_c_min: 5.0           # Score 5.0 - 5.9: Priority C
    reject_below: 5.0             # Score < 5.0: Rejected
  role_account_weights:
    named_person: 1.0             # Full credit (+1.0)
    departmental: 0.5             # Medium credit (+0.5 for sales@, dispatch@, ops@)
    generic_inbox: 0.2            # Lowest credit (+0.2 for info@, admin@, support@)

# Research Budget & Rate Limits per Company
research_budget:
  max_discovery_pages_per_source: 10
  max_verification_attempts: 3
  max_decision_maker_searches: 3
  max_intent_searches: 2
  max_website_pages_to_crawl: 6
  http_timeout_seconds: 15
  browser_timeout_seconds: 25
  delay_between_requests_ms: 1200

# Security, Domain Allowlist & Safe Scraping
security:
  strict_robots_respect: true
  pause_on_captcha: true
  allowed_domains:
    - "safer.fmcsa.dot.gov"
    - "ai.fmcsa.dot.gov"
    - "google.com"
    - "www.google.com"
    - "maps.google.com"
    - "news.google.com"
    - "linkedin.com"
    - "www.linkedin.com"
    - "indeed.com"
    - "www.indeed.com"
    - "bbb.org"
    - "www.bbb.org"
    - "yellowpages.com"
    - "www.yellowpages.com"
    - "chamberofcommerce.com"
  blocked_domains:
    - "*.gov.ru"
    - "*.cn"

# Source Adapter Toggles (Phase 1 + Phase 2 Preview)
sources:
  fmcsa_safer:
    enabled: true
    priority: 1
    timeout: 20
  google_maps:
    enabled: true
    priority: 2
    timeout: 20
  google_search:
    enabled: true
    priority: 3
    timeout: 15
  company_website:
    enabled: true
    priority: 4
    timeout: 25
  linkedin_public:
    enabled: true
    priority: 5
    timeout: 20
  indeed:
    enabled: true
    priority: 6
    timeout: 15
  google_news:
    enabled: true
    priority: 7
    timeout: 15
  # Phase 2 Adapters (Registered & Staged)
  ziprecruiter:
    enabled: false
    priority: 8
  bbb:
    enabled: false
    priority: 9
  yellow_pages:
    enabled: false
    priority: 10
  chamber_of_commerce:
    enabled: false
    priority: 11
  sam_gov:
    enabled: false
    priority: 12
  freightwaves:
    enabled: false
    priority: 13
  transport_topics:
    enabled: false
    priority: 14

# Google Sheets Output Settings
google_sheets:
  enabled: true
  spreadsheet_id: ""  # Set via GOOGLE_SHEET_ID env var or UI
  sheet_name: "TRUCKLEAD_AUTOPILOT_RESULTS"
  export_local_backup_csv: true
  export_local_backup_xlsx: true
  backup_dir: "./exports"
  tabs:
    final_leads: "FINAL_LEADS"
    research_queue: "RESEARCH_QUEUE"
    rejected: "REJECTED"
    source_log: "SOURCE_LOG"
    run_report: "RUN_REPORT"
    callable_mailable: "CALLABLE_MAILABLE_LEADS"

# Pipeline & State Configuration
pipeline:
  pause_shipper_discovery: true # Pauses shipper discovery until Google Places API key & contact enrichment are operational
  benchmark_states:
    - "TX"
    - "GA"
    - "OH"
  sync_states:
    - "TX"
    - "GA"
    - "FL"
    - "NC"
    - "TN"

# CAN-SPAM Compliance & Sender Identity (15 U.S.C. § 7704(a)(5)(A))
compliance:
  postal_address: "" # Operator physical street address required by CAN-SPAM Act
  sender_identity: "" # Operator / Dispatcher identity required for commercial emails
  sender_email: "dispatch@trucklead-autopilot.internal"
  unsubscribe_url: "http://localhost:8000/api/compliance/opt-out"

# Compliant Outreach Settings
outreach:
  enable_continuous_autopilot: false

# Contact Channel Verification Configuration
contact_verification:
  phone:
    default_provider: "twilio"
    cost_cap_per_lead: 0.05
    cost_cap_per_run: 5.00
    cache_ttl_days: 30
  email:
    verify_mx: true
    disposable_domain_check: true
    cost_cap_per_lead: 0.05
    cost_cap_per_run: 5.00

# Autopilot Safeguards & Limits
autopilot:
  per_cycle_leads_cap: 50
  per_cycle_spend_cap: 2.00
  max_requests_per_host_per_min: 30

# Signal Datasets & Synchronization Configuration
signals:
  sync_caps:
    insurance_limit: 500
    authority_history_limit: 500
    new_applications_limit: 500
    sync_stored_carriers_first: true
  engine:
    version: "2.0"
    max_intent_points: 3.0
    half_life_days:
      new_authority: 45
      insurance_cancel_pending: 15
      mcs150_recent_update: 60
      power_units_growth: 90
      generic_intent: 30
    weights:
      new_authority: 2.0
      insurance_cancel_pending: 1.5
      mcs150_recent_update: 0.5 # Small capped weight for recent updates within 60 days
      power_units_growth: 1.5
      generic_intent: 1.0
    new_authority_window:
      min_days: 30
      max_days: 120
    mcs150_window_days: 60

# M6 Call Queue for Unproven Carriers
call_queue:
  daily_cap: 30
  default_sort: "fit_score"


